# Сайт-резюме: https://new.denisenkosergey.ru
# Статическая сборка Vite в /var/www/vcard. Сертификат и редирект на HTTPS добавляет certbot.
server {
    server_name new.denisenkosergey.ru;

    root /var/www/vcard;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    # Сборка Vite: имена с хешем, можно кэшировать навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы новая сборка подхватывалась сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/new.denisenkosergey.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/new.denisenkosergey.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = new.denisenkosergey.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name new.denisenkosergey.ru;
    return 404; # managed by Certbot


}