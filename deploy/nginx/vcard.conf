# Сайт-резюме: https://denisenkosergey.ru
# Статическая сборка Vite в /var/www/vcard. Сертификаты выпущены certbot certonly --nginx,
# поэтому certbot этот файл не правит: при изменениях редактируйте его здесь и копируйте на сервер.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name denisenkosergey.ru;

    ssl_certificate /etc/letsencrypt/live/denisenkosergey.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denisenkosergey.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/vcard;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    # Сборка Vite: имена с хешем, можно кэшировать навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы новая сборка подхватывалась сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Curveball остался в каталоге старого сайта, а ссылка на него в резюме — на основном домене
    location /curveball/ {
        root /var/www/html;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# www и прежний адрес new. ведут на основной домен
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.denisenkosergey.ru;

    ssl_certificate /etc/letsencrypt/live/denisenkosergey.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denisenkosergey.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://denisenkosergey.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name new.denisenkosergey.ru;

    ssl_certificate /etc/letsencrypt/live/new.denisenkosergey.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.denisenkosergey.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://denisenkosergey.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name denisenkosergey.ru www.denisenkosergey.ru new.denisenkosergey.ru;
    return 301 https://denisenkosergey.ru$request_uri;
}
