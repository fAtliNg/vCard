# Сервер по умолчанию: запросы по IP и на неизвестные имена.
# Блоки denisenkosergey.ru отсюда перенесены в vcard.conf и old.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    server_name _;

    location / {
        try_files $uri $uri/ =404;
    }
}
