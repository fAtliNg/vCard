# Прежний сайт-резюме (шаблон vCard/lmpixels): https://old.denisenkosergey.ru
# Файлы остались на месте, в /var/www/html. Сертификат выпущен certbot certonly --nginx.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name old.denisenkosergey.ru;

    ssl_certificate /etc/letsencrypt/live/old.denisenkosergey.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/old.denisenkosergey.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name old.denisenkosergey.ru;
    return 301 https://old.denisenkosergey.ru$request_uri;
}
